name: Build iOS App (.ipa)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Cho phép bấm nút Build thủ công trên GitHub

jobs:
  build:
    runs-on: macos-latest # GitHub sẽ cấp cho bạn một máy Mac ảo miễn phí

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Thiết lập môi trường Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Cài đặt Rust iOS target
      run: rustup target add aarch64-apple-ios

    - name: Cache MLC-LLM Runtime
      id: cache-mlc
      uses: actions/cache@v4
      with:
        path: |
          mlc-llm-temp
          ios_app/build
          ios_app/MLCSwift/tvm_home
          ios_app/MLCChat/dist/lib
        key: ${{ runner.os }}-mlc-runtime-${{ hashFiles('ios_app/prepare_libs.sh') }}

    - name: Cài đặt MLC-LLM Runtime (Headers & Dependencies)
      if: steps.cache-mlc.outputs.cache-hit != 'true'
      run: |
        echo "Đang chuẩn bị thư viện và header cho MLC (Cache Miss)..."
        git clone --depth 1 --recursive https://github.com/mlc-ai/mlc-llm.git mlc-llm-temp
        
        # Sửa lỗi thiếu header (đảm bảo ở cả MLCSwift và Root)
        mkdir -p ios_app/MLCSwift/tvm_home
        cp -r mlc-llm-temp/3rdparty/tvm/* ios_app/MLCSwift/tvm_home/
        mkdir -p tvm_home
        cp -r mlc-llm-temp/3rdparty/tvm/* tvm_home/
        
        # Build các thư viện tĩnh .a
        cd ios_app
        export MLC_LLM_SOURCE_DIR=$(pwd)/../mlc-llm-temp
        bash prepare_libs.sh --arch arm64
        
        # Di chuyển thư viện vào đúng vị trí dist/lib mà Xcode mong đợi
        mkdir -p MLCChat/dist/lib
        cp build/lib/*.a MLCChat/dist/lib/
        
        # Kiểm tra sự tồn tại của file
        echo "Các thư viện đã chuẩn bị (Cache Miss):"
        ls -lh MLCChat/dist/lib/

    - name: Kiểm tra thư viện từ Cache
      if: steps.cache-mlc.outputs.cache-hit == 'true'
      run: |
        echo "Sử dụng Runtime từ Cache."
        ls -lh ios_app/MLCChat/dist/lib/
    
    - name: Biên dịch App (Build Unsigned)
      run: |
        # Đảm bảo đường dẫn build_output sạch sẽ
        rm -rf build_output
        xcodebuild build -project ios_app/MLCChat/MLCChat.xcodeproj \
                   -scheme MLCChat \
                   -sdk iphoneos \
                   -configuration Release \
                   -derivedDataPath build_output \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_ENTITLEMENTS="" \
                   CODE_SIGNING_IDENTITY="" \
                   AD_HOC_CODE_SIGNING_ALLOWED=YES

    - name: Đóng gói IPA thủ công (Manual IPA)
      run: |
        mkdir -p Payload
        APP_PATH=$(find build_output -name "*.app" | head -n 1)
        cp -r "$APP_PATH" Payload/
        zip -r MLCChat-Unsigned.ipa Payload
    
    - name: Đẩy tệp lên GitHub (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: iPhone-App-IPA
        path: MLCChat-Unsigned.ipa
