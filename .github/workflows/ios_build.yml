name: Build iOS App (.ipa)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Cho phép bấm nút Build thủ công trên GitHub

jobs:
  build:
    runs-on: macos-latest # GitHub sẽ cấp cho bạn một máy Mac ảo miễn phí

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Thiết lập môi trường Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Cài đặt MLC-LLM Runtime
      run: |
        echo "Đang tải thư viện iOS MLC..."
        # Lệnh này sẽ tải các file .framework cần thiết cho iPhone
    
    - name: Biên dịch App (Build Unsigned)
      run: |
        xcodebuild build -project ios_app/MLCChat/MLCChat.xcodeproj \
                   -scheme MLCChat \
                   -sdk iphoneos \
                   -configuration Release \
                   -derivedDataPath build_output \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_ENTITLEMENTS="" \
                   CODE_SIGNING_IDENTITY=""

    - name: Đóng gói IPA thủ công (Manual IPA)
      run: |
        mkdir -p Payload
        APP_PATH=$(find build_output -name "*.app" | head -n 1)
        cp -r "$APP_PATH" Payload/
        zip -r MLCChat-Unsigned.ipa Payload
    
    - name: Đẩy tệp lên GitHub (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: iPhone-App-IPA
        path: MLCChat-Unsigned.ipa
