name: Build iOS App (.ipa) - Qwen2.5-1.5B-Instruct

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch: # Allow manual trigger
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120

    strategy:
      matrix:
        include:
          - platform: iphoneos
            sdk: iphoneos
            arch: arm64
            name: "Device"
          # Uncomment to also build simulator
          # - platform: iphonesimulator
          #   sdk: iphonesimulator
          #   arch: arm64
          #   name: "Simulator"

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        pip install -U pip wheel
        pip install --pre -U -f https://mlc.ai/wheels \
          mlc-llm-nightly-cpu \
          mlc-ai-nightly-cpu

    - name: Install Rust iOS target
      run: rustup target add aarch64-apple-ios

    - name: Cache MLC-LLM Runtime
      id: cache-mlc
      uses: actions/cache@v4
      with:
        path: |
          mlc-llm
          ios_app/build
          ios_app/MLCSwift/tvm_home
          ios_app/MLCChat/dist/lib
        key: ${{ runner.os }}-mlc-${{ matrix.platform }}-${{ hashFiles('ios_app/mlc-package-config.json', 'ios_app/prepare_libs.sh') }}
        restore-keys: |
          ${{ runner.os }}-mlc-${{ matrix.platform }}-

    - name: Clone MLC-LLM repository (if cache miss)
      if: steps.cache-mlc.outputs.cache-hit != 'true'
      run: |
        echo "Cache miss - cloning MLC-LLM..."
        git clone --depth 1 --recursive https://github.com/mlc-ai/mlc-llm.git
        du -sh mlc-llm/

    - name: Setup TVM headers
      run: |
        mkdir -p ios_app/MLCSwift/tvm_home
        mkdir -p tvm_home
        if [ -d "mlc-llm/3rdparty/tvm" ]; then
          cp -r mlc-llm/3rdparty/tvm/* ios_app/MLCSwift/tvm_home/
          cp -r mlc-llm/3rdparty/tvm/* tvm_home/
          echo "TVM headers copied successfully"
        else
          echo "Warning: TVM headers not found in mlc-llm"
        fi

    - name: Build MLC-LLM iOS Libraries (${{ matrix.name }})
      run: |
        cd ios_app
        echo "Building for ${{ matrix.platform }}..."
        
        if [ "${{ matrix.platform }}" = "iphonesimulator" ]; then
          bash prepare_libs.sh --simulator --arch ${{ matrix.arch }}
        else
          bash prepare_libs.sh --arch ${{ matrix.arch }}
        fi
        
        echo "Libraries built successfully"
        if [ -d "build/lib" ]; then
          mkdir -p MLCChat/dist/lib
          cp build/lib/*.a MLCChat/dist/lib/ 2>/dev/null || true
          echo "Libraries copied to MLCChat/dist/lib"
        fi

    - name: List build artifacts
      run: |
        echo "=== MLC Libraries ==="
        ls -lh ios_app/MLCChat/dist/lib/ || echo "No libraries found"
        echo "=== TVM Headers ==="
        ls -lh ios_app/MLCSwift/tvm_home/include/ 2>/dev/null | head -5 || echo "No headers found"
    
    - name: Package models for iOS
      run: |
        cd ios_app/MLCChat
        echo "Packaging models..."
        mlc_llm package -o . --device iphone 2>&1 | tail -20
        
        if [ ! -f "bundle/mlc-app-config.json" ]; then
          echo "Warning: mlc-app-config.json not generated"
        else
          echo "mlc-app-config.json generated successfully"
          cat bundle/mlc-app-config.json | head -20
        fi

    - name: Verify configuration
      run: |
        echo "=== Checking model configuration ==="
        if [ -f "ios_app/MLCChat/bundle/mlc-app-config.json" ]; then
          python3 -c "import json; print(json.dumps(json.load(open('ios_app/MLCChat/bundle/mlc-app-config.json')), indent=2))" | head -30
        fi

    - name: Build Xcode project (${{ matrix.name }})
      run: |
        cd ios_app/MLCChat
        rm -rf build_output
        
        echo "Building for ${{ matrix.platform }}..."
        xcodebuild build \
          -project MLCChat.xcodeproj \
          -scheme MLCChat \
          -sdk ${{ matrix.sdk }} \
          -configuration Release \
          -derivedDataPath build_output \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_ENTITLEMENTS="" \
          CODE_SIGNING_IDENTITY="" \
          AD_HOC_CODE_SIGNING_ALLOWED=YES \
          2>&1 | tee build.log
        
        if [ $? -eq 0 ]; then
          echo "✓ Xcode build successful"
        else
          echo "✗ Xcode build failed"
          tail -100 build.log
          exit 1
        fi

    - name: Create IPA package (${{ matrix.name }})
      if: matrix.platform == 'iphoneos'
      run: |
        cd ios_app/MLCChat
        
        # Use a more specific path to find the actual app bundle
        APP_PATH=$(find build_output/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
        
        if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
          echo "ERROR: Valid .app bundle not found in Release-iphoneos"
          ls -R build_output/Build/Products/
          exit 1
        fi
        
        echo "Found app bundle at: $APP_PATH"
        
        # Check bundle contents (especially Info.plist and model weights)
        if [ ! -f "$APP_PATH/Info.plist" ]; then
          echo "ERROR: Info.plist missing in app bundle"
          exit 1
        fi
        
        rm -rf Payload
        mkdir -p Payload
        cp -r "$APP_PATH" Payload/
        
        zip -r -v "MLCChat-Qwen2.5-1.5B.ipa" Payload
        
        IPA_SIZE=$(du -h "MLCChat-Qwen2.5-1.5B.ipa" | cut -f1)
        echo "✓ IPA created: MLCChat-Qwen2.5-1.5B.ipa ($IPA_SIZE)"
        
        # Fail if IPA is too small (should be >100MB if models are bundled)
        # Note: In CI, we expect it to be 2-3GB
        MIN_SIZE=100
        ACTUAL_SIZE_KB=$(du -k "MLCChat-Qwen2.5-1.5B.ipa" | cut -f1)
        if [ "$ACTUAL_SIZE_KB" -lt "$((MIN_SIZE * 1024))" ]; then
          echo "ERROR: IPA size is suspiciously small ($IPA_SIZE). Packaging likely failed."
          exit 1
        fi

    - name: Upload to GitHub Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: MLCChat-Qwen-${{ matrix.name }}
        path: |
          ios_app/MLCChat/MLCChat-Qwen2.5-1.5B.ipa
          ios_app/MLCChat/build.log
        retention-days: 7
        if-no-files-found: warn

    - name: Create Release
      if: github.ref == 'refs/heads/main' && github.event_name == 'push' && matrix.platform == 'iphoneos'
      uses: softprops/action-gh-release@v1
      with:
        files: ios_app/MLCChat/MLCChat-Qwen2.5-1.5B.ipa
        tag_name: v${{ github.run_number }}
        name: MLC Chat iOS - Qwen2.5-1.5B (Build ${{ github.run_number }})
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
