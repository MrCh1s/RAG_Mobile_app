name: Build iOS App (.ipa) - Qwen2.5-1.5B-Instruct

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 180

    strategy:
      matrix:
        include:
          - platform: iphoneos
            sdk: iphoneos
            arch: arm64
            name: "Device"

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4   # keep v4 until v5 is stable for your use case
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Setup Python
        uses: actions/setup-python@v5   # ← bumped to v5
        with:
          python-version: '3.11'        # ← 3.11 avoids some 3.10 compat bugs with mlc

      - name: Install Python dependencies and Build MLC-LLM from source
        run: |
          python3 -m pip install -U pip wheel pytest
          
          # Install mlc_ai_nightly_cpu
          python3 -m pip install \
            "https://github.com/mlc-ai/package/releases/download/v0.9.dev0/mlc_ai_nightly_cpu-0.20.dev1070-py3-none-macosx_13_0_arm64.whl"
          
          # Clone MLC-LLM repository recursively
          git clone --depth 1 --recursive https://github.com/mlc-ai/mlc-llm.git
          
          # Set up prebuilt TVM directory for CMake to link against installed mlc_ai wheel
          mkdir -p tvm_prebuilt/build
          ln -s "$GITHUB_WORKSPACE/mlc-llm/3rdparty/tvm/include" tvm_prebuilt/include
          ln -s "$GITHUB_WORKSPACE/mlc-llm/3rdparty/tvm/3rdparty" tvm_prebuilt/3rdparty
          
          TVM_PYTHON_PATH=$(python3 -c "import tvm, os; print(os.path.dirname(tvm.__file__))")
          ln -s "$TVM_PYTHON_PATH/lib/libtvm_runtime.dylib" tvm_prebuilt/build/libtvm_runtime.dylib
          ln -s "$TVM_PYTHON_PATH/lib/libtvm_compiler.dylib" tvm_prebuilt/build/libtvm.dylib
          
          # Build MLC-LLM C++ libraries
          cd mlc-llm
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DTVM_HOME="$GITHUB_WORKSPACE/tvm_prebuilt" \
            -DUSE_METAL=ON
          cmake --build . --parallel 4
          cd ..
          
          # Install python package in editable mode
          cd python
          python3 -m pip install -e .
          cd ../..
          
          # Copy compiled dynamic library and symlink TVM runtimes to satisfy rpath requirements
          cp mlc-llm/build/libmlc_llm_module.dylib mlc-llm/python/mlc_llm/
          ln -sf "$TVM_PYTHON_PATH/lib/libtvm_runtime.dylib" "$GITHUB_WORKSPACE/mlc-llm/python/mlc_llm/libtvm_runtime.dylib"
          ln -sf "$TVM_PYTHON_PATH/lib/libtvm_runtime.dylib" "$GITHUB_WORKSPACE/mlc-llm/python/mlc_llm/libtvm.dylib"
          ln -sf "$TVM_PYTHON_PATH/lib/libtvm_compiler.dylib" "$GITHUB_WORKSPACE/mlc-llm/python/mlc_llm/libtvm_compiler.dylib"
          
          # Verify mlc_llm is importable from the correct python
          python3 -c "import mlc_llm; print('mlc_llm OK:', mlc_llm.__file__)"

      - name: Install Rust iOS target
        run: rustup target add aarch64-apple-ios

      - name: Cache MLC-LLM Runtime
        id: cache-mlc
        uses: actions/cache@v4
        with:
          path: |
            mlc-llm
            apps/ios_app/build
            apps/ios_app/MLCSwift/tvm_home
            apps/ios_app/MLCChat/dist/lib
          key: ${{ runner.os }}-mlc-${{ matrix.platform }}-${{ hashFiles('apps/ios_app/MLCChat/mlc-package-config.json', 'apps/ios_app/prepare_libs.sh') }}
          restore-keys: |
            ${{ runner.os }}-mlc-${{ matrix.platform }}-

      - name: Cache Model Bundle
        id: cache-bundle
        uses: actions/cache@v4
        with:
          path: apps/ios_app/MLCChat/bundle
          key: ${{ runner.os }}-bundle-v3-${{ hashFiles('apps/ios_app/MLCChat/mlc-package-config.json') }}
          restore-keys: |
            ${{ runner.os }}-bundle-

      - name: Clone MLC-LLM repository
        run: |
          if [ ! -d "mlc-llm" ] || [ ! -f "mlc-llm/3rdparty/tvm/include/tvm/runtime/module.h" ] || [ ! -f "mlc-llm/3rdparty/tvm/3rdparty/tvm-ffi/include/tvm/ffi/extra/module.h" ]; then
            echo "Cloning MLC-LLM..."
            rm -rf mlc-llm
            git clone --depth 1 https://github.com/mlc-ai/mlc-llm.git
            cd mlc-llm
            echo "Initializing required submodules..."
            git submodule update --init 3rdparty/tvm 3rdparty/tokenizers-cpp 3rdparty/xgrammar
            cd 3rdparty/tvm
            echo "Initializing nested TVM submodules..."
            git submodule update --init --recursive 3rdparty/tvm-ffi
            cd "$GITHUB_WORKSPACE"
          else
            echo "mlc-llm directory and TVM headers restored from cache."
          fi
          
          if [ ! -f "mlc-llm/3rdparty/tvm/include/tvm/runtime/module.h" ]; then
            echo "Listing contents of mlc-llm/3rdparty/tvm:"
            ls -la mlc-llm/3rdparty/tvm
            if [ -d "mlc-llm/3rdparty/tvm/include" ]; then
              echo "Listing contents of mlc-llm/3rdparty/tvm/include:"
              ls -la mlc-llm/3rdparty/tvm/include
            fi
            echo "ERROR: TVM headers are missing in mlc-llm/3rdparty/tvm!"
            exit 1
          fi
          if [ ! -f "mlc-llm/3rdparty/tvm/3rdparty/tvm-ffi/include/tvm/ffi/extra/module.h" ]; then
            echo "ERROR: TVM FFI headers are missing in mlc-llm/3rdparty/tvm/3rdparty/tvm-ffi!"
            exit 1
          fi
          du -sh mlc-llm/

      - name: Setup TVM headers
        run: |
          rm -rf apps/ios_app/MLCSwift/tvm_home
          rm -rf tvm_home
          if [ -d "mlc-llm/3rdparty/tvm" ]; then
            ln -sf "$GITHUB_WORKSPACE/mlc-llm/3rdparty/tvm" apps/ios_app/MLCSwift/tvm_home
            ln -sf "$GITHUB_WORKSPACE/mlc-llm/3rdparty/tvm" tvm_home
            echo "TVM headers symlinked successfully"
          else
            echo "Warning: TVM headers not found in mlc-llm"
          fi
          if [ ! -f "apps/ios_app/MLCSwift/tvm_home/include/tvm/runtime/module.h" ]; then
            echo "ERROR: TVM headers were not copied successfully! Check if mlc-llm/3rdparty/tvm is populated."
            exit 1
          fi

      - name: Build MLC-LLM iOS Libraries (${{ matrix.name }})
        run: |
          set -o pipefail
          cd apps/ios_app
          echo "Building for ${{ matrix.platform }}..."

          if [ "${{ matrix.platform }}" = "iphonesimulator" ]; then
            bash prepare_libs.sh --simulator --arch ${{ matrix.arch }}
          else
            bash prepare_libs.sh --arch ${{ matrix.arch }}
          fi

          echo "Libraries built successfully"
          if [ -d "build/lib" ]; then
            mkdir -p MLCChat/dist/lib
            cp build/lib/*.a MLCChat/dist/lib/ 2>/dev/null || true
            echo "Libraries copied to MLCChat/dist/lib"
          else
            echo "Error: build/lib directory not found!"
            exit 1
          fi

          # Create backward-compatible symlinks for Xcode project expectations
          cd MLCChat/dist/lib
          if [ -f "libmlc_llm.a" ] && [ ! -f "libmlc_llm_static.a" ]; then
            ln -sf libmlc_llm.a libmlc_llm_static.a
            echo "Created symlink: libmlc_llm_static.a -> libmlc_llm.a"
          fi
          cd "$GITHUB_WORKSPACE"

      - name: Debug Python Environment
        run: |
          echo "=== Python Debug Info ==="
          which python3
          python3 --version
          python3 -c "import sys; print('Python executable:', sys.executable)"
          python3 -m pip list | grep -i mlc || echo "mlc not found in pip list!"

      - name: List build artifacts
        run: |
          echo "=== MLC Libraries ==="
          ls -lh apps/ios_app/MLCChat/dist/lib/ || echo "No libraries found"
          echo "=== TVM Headers ==="
          ls -lh apps/ios_app/MLCSwift/tvm_home/include/ 2>/dev/null | head -5 || echo "No headers found"

      - name: Free disk space
        run: |
          echo "Initial disk space:"
          df -h
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/*
          echo "Disk space after cleanup:"
          df -h

      - name: Package models for iOS
        if: steps.cache-bundle.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          export MLC_LLM_SOURCE_DIR="$GITHUB_WORKSPACE/mlc-llm"

          # Tìm đúng vị trí file config
          CONFIG_PATH="$GITHUB_WORKSPACE/apps/ios_app/MLCChat/mlc-package-config.json"
          if [ ! -f "$CONFIG_PATH" ]; then
          # Thử ở apps/ios_app/ nếu không có trong MLCChat/
          CONFIG_PATH="$GITHUB_WORKSPACE/apps/ios_app/mlc-package-config.json"
          fi
          echo "Using config: $CONFIG_PATH"
          cat "$CONFIG_PATH"

          # Chạy từ thư mục chứa Xcode project
          cd "$GITHUB_WORKSPACE/apps/ios_app/MLCChat"

          echo "Python: $(which python3) ($(python3 --version))"

          # Set JIT policy to REDO to force recompilation but capture any errors early.
          # The RawStr error is triggered in tvm.tirx.build Metal codegen.
          # Set JIT policy to REDO to force recompilation during packaging
          export MLC_JIT_POLICY=REDO

          python3 -m mlc_llm package \
          --package-config "$CONFIG_PATH" \
          --mlc-llm-source-dir "$MLC_LLM_SOURCE_DIR" \
          --output . \
          2>&1 | tee package.log || {
          echo "=== PACKAGE FAILED ==="
          tail -n 50 package.log
          exit 1
          }

          echo "=== Last 20 lines ==="
          tail -n 20 package.log

          if [ ! -f "bundle/mlc-app-config.json" ]; then
            echo "Warning: mlc-app-config.json not generated"
          else
            echo "mlc-app-config.json generated successfully"
            head -20 bundle/mlc-app-config.json
          fi

      - name: Patch mlc-chat-config.json
        shell: python
        run: |
          import json, os
          path = 'apps/ios_app/MLCChat/bundle/Qwen2.5-1.5B-Instruct-q4f16_1-MLC/mlc-chat-config.json'
          if os.path.exists(path):
              with open(path, 'r') as f:
                  config = json.load(f)
              config['context_window_size'] = 2048
              config['prefill_chunk_size'] = 128
              config['max_batch_size'] = 1
              config['model_lib'] = 'model_iphone'
              if 'model_config' in config:
                  config['model_config']['context_window_size'] = 2048
                  config['model_config']['prefill_chunk_size'] = 128
                  config['model_config']['max_batch_size'] = 1
              with open(path, 'w') as f:
                  json.dump(config, f, indent=4)
              print('✓ Patched config successfully')
          else:
              print(f'! Warning: config file not found to patch at {path}')

      - name: Compile real model library
        run: |
          DIST_LIB="$GITHUB_WORKSPACE/apps/ios_app/MLCChat/dist/lib"
          MODEL_LIB_DEST="$DIST_LIB/libmodel_iphone.a"
          
          echo "Compiling optimized model library for iOS..."
          # We use the model in the bundle generated by the package step
          MODEL_PATH="$GITHUB_WORKSPACE/apps/ios_app/MLCChat/bundle/Qwen2.5-1.5B-Instruct-q4f16_1-MLC"
          
          # Compile to .tar (objects) for iOS
          python3 -m mlc_llm compile "$MODEL_PATH" \
            --device metal \
            --host arm64-apple-ios \
            --system-lib-prefix model_iphone \
            --output "$DIST_LIB/libmodel_iphone.tar"
            
          echo "Extracting objects and creating static library..."
          mkdir -p /tmp/model_obj
          tar -xf "$DIST_LIB/libmodel_iphone.tar" -C /tmp/model_obj
          
          # Use libtool to create the static library from all object files
          xcrun --sdk iphoneos libtool -static /tmp/model_obj/*.o -o "$MODEL_LIB_DEST"
          
          echo "✓ Real libmodel_iphone.a created successfully."
          ls -lh "$MODEL_LIB_DEST"
          rm -rf /tmp/model_obj "$DIST_LIB/libmodel_iphone.tar"

      - name: Verify Libraries
        run: |
          set -o pipefail
          echo "=== Verifying Libraries in apps/ios_app/MLCChat/dist/lib ==="
          ls -lh apps/ios_app/MLCChat/dist/lib/

          # The newer build output uses libmlc_llm.a (not libmlc_llm_static.a)
          REQUIRED_LIBS=(
            "libmlc_llm.a"
            "libtvm_runtime.a"
          )

          for lib in "${REQUIRED_LIBS[@]}"; do
            if [ ! -f "apps/ios_app/MLCChat/dist/lib/$lib" ]; then
              echo "Error: Required library $lib is missing!"
              ls -R apps/ios_app/MLCChat/dist/lib/
              exit 1
            fi
          done

          # libmodel_iphone.a is produced by mlc_llm package; verify bundle instead
          if [ ! -f "apps/ios_app/MLCChat/bundle/mlc-app-config.json" ]; then
            echo "Error: bundle/mlc-app-config.json missing - package step likely failed"
            exit 1
          fi
          echo "✓ All required libraries are present."
          echo "✓ Model bundle exists."

      - name: Generate and Compile CoreML Embedding Model
        run: |
          set -o pipefail
          echo "Installing dependencies for CoreML..."
          python3 -m pip install coremltools transformers torch
          
          echo "Running export script..."
          python3 scripts/export_embedding_coreml.py
          
          echo "Compiling .mlpackage to .mlmodelc..."
          xcrun coremlcompiler compile Vietnamese_SBERT_CoreML.mlpackage apps/ios_app/MLCChat/bundle/
          
          echo "Copying vocab.txt to bundle..."
          cp scripts/vocab.txt apps/ios_app/MLCChat/bundle/
          
          echo "Verify compiled model and vocab:"
          ls -lah apps/ios_app/MLCChat/bundle/Vietnamese_SBERT_CoreML.mlmodelc
          ls -lah apps/ios_app/MLCChat/bundle/vocab.txt

      - name: Build Xcode project (${{ matrix.name }})
        run: |
          set -o pipefail
          cd apps/ios_app/MLCChat
          rm -rf build_output

          # The Xcode CopyFiles build phase expects dist/bundle to exist.
          # mlc_llm package creates bundle/ (not dist/bundle/).
          # Create dist/bundle as a symlink so Xcode can copy the model into the .app
          if [ -d "bundle" ] && [ ! -e "dist/bundle" ]; then
            mkdir -p dist
            ln -sf "$(pwd)/bundle" dist/bundle
            echo "Created dist/bundle -> bundle symlink"
          elif [ -e "dist/bundle" ]; then
            echo "dist/bundle already exists"
          else
            echo "WARNING: bundle/ directory not found! Model will not be copied into .app"
          fi

          echo "Building for ${{ matrix.platform }}..."
          xcodebuild build \
            -project MLCChat.xcodeproj \
            -scheme MLCChat \
            -sdk ${{ matrix.sdk }} \
            -configuration Release \
            -derivedDataPath build_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee build.log || {
            echo "=== XCODE BUILD FAILED ==="
            echo "--- Last 100 lines of build.log ---"
            tail -n 100 build.log
            exit 1
          }

          # bundle/ is NOT deleted here - it is needed at runtime on device for JIT model loading
          # (CopyFiles build phase already copied it into the .app bundle)
          rm -rf ~/.cache/mlc_llm

          echo "✓ Xcode build successful"

      - name: Create IPA package (${{ matrix.name }})
        if: matrix.platform == 'iphoneos'
        run: |
          set -o pipefail
          cd apps/ios_app/MLCChat

          APP_PATH=$(find build_output/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Valid .app bundle not found in Release-iphoneos"
            ls -R build_output/Build/Products/ || true
            exit 1
          fi

          echo "Found app bundle at: $APP_PATH"
          ls -la "$APP_PATH"

          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "ERROR: Info.plist missing in app bundle"
            find "$APP_PATH" -name "Info.plist"
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          rm -rf build_output

          zip -r -v "MLCChat-Qwen2.5-1.5B.ipa" Payload

          IPA_SIZE=$(du -h "MLCChat-Qwen2.5-1.5B.ipa" | cut -f1)
          echo "✓ IPA created: MLCChat-Qwen2.5-1.5B.ipa ($IPA_SIZE)"

          MIN_SIZE_KB=10240
          ACTUAL_SIZE_KB=$(du -k "MLCChat-Qwen2.5-1.5B.ipa" | cut -f1)
          if [ "$ACTUAL_SIZE_KB" -lt "$MIN_SIZE_KB" ]; then
            echo "ERROR: IPA size is suspiciously small (${ACTUAL_SIZE_KB}KB < ${MIN_SIZE_KB}KB). Packaging likely failed."
            exit 1
          fi

      - name: Upload to GitHub Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MLCChat-Qwen-${{ matrix.name }}
          path: |
            apps/ios_app/MLCChat/MLCChat-Qwen2.5-1.5B.ipa
            apps/ios_app/MLCChat/build.log
          retention-days: 7
          if-no-files-found: warn

      - name: Create Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && matrix.platform == 'iphoneos'
        uses: softprops/action-gh-release@v1
        with:
          files: apps/ios_app/MLCChat/MLCChat-Qwen2.5-1.5B.ipa
          tag_name: v${{ github.run_number }}
          name: MLC Chat iOS - Qwen2.5-1.5B (Build ${{ github.run_number }})
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

