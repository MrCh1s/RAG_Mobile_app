name: Build iOS App (.ipa) - Qwen2.5-1.5B-Instruct

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14  # Pin to macOS 14 (Sonoma) - macos-latest now = macOS 26 Tahoe beta
                       # which breaks mlc_ai_nightly_cpu wheel (compiled for macosx_13_0_arm64)

    timeout-minutes: 180

    strategy:
      matrix:
        include:
          - platform: iphoneos
            sdk: iphoneos
            arch: arm64
            name: "Device"

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python3 -m pip install -U pip wheel pytest "numpy<2" cloudpickle ml_dtypes packaging psutil scipy tornado typing_extensions

      - name: Install Rust iOS target
        run: rustup target add aarch64-apple-ios

      - name: Cache MLC-LLM Runtime
        id: cache-mlc
        uses: actions/cache@v4
        with:
          path: |
            mlc-llm
            apps/ios_app/build
            apps/ios_app/MLCSwift/tvm_home
            apps/ios_app/MLCChat/dist/lib
          key: ${{ runner.os }}-mlc-v2-${{ matrix.platform }}-${{ hashFiles('apps/ios_app/MLCChat/mlc-package-config.json', 'apps/ios_app/prepare_libs.sh') }}
          restore-keys: |
            ${{ runner.os }}-mlc-v2-${{ matrix.platform }}-

      - name: Clone MLC-LLM repository
        run: |
          if [ ! -d "mlc-llm" ] || [ ! -f "mlc-llm/3rdparty/tvm/include/tvm/runtime/logging.h" ] || [ ! -f "mlc-llm/3rdparty/tvm/3rdparty/tvm-ffi/include/tvm/ffi/extra/module.h" ] || [ ! -f "mlc-llm/3rdparty/stb/stb_image.h" ]; then
            echo "Cloning MLC-LLM..."
            rm -rf mlc-llm
            git clone --depth 1 https://github.com/mlc-ai/mlc-llm.git
            cd mlc-llm
            echo "Initializing required submodules..."
            git submodule update --init 3rdparty/tvm 3rdparty/xgrammar 3rdparty/stb
            # tokenizers-cpp has nested submodules (msgpack, sentencepiece) required by cmake
            git submodule update --init --recursive 3rdparty/tokenizers-cpp
            cd 3rdparty/tvm
            echo "Initializing nested TVM submodules..."
            git submodule update --init --recursive 3rdparty/tvm-ffi
            cd "$GITHUB_WORKSPACE"
          else
            echo "mlc-llm directory and TVM headers restored from cache."
          fi

          if [ ! -f "mlc-llm/3rdparty/tvm/include/tvm/runtime/logging.h" ]; then
            echo "ERROR: TVM headers are missing in mlc-llm/3rdparty/tvm!"
            exit 1
          fi
          if [ ! -f "mlc-llm/3rdparty/tvm/3rdparty/tvm-ffi/include/tvm/ffi/extra/module.h" ]; then
            echo "ERROR: TVM FFI headers are missing in mlc-llm/3rdparty/tvm/3rdparty/tvm-ffi!"
            exit 1
          fi
          if [ ! -f "mlc-llm/3rdparty/stb/stb_image.h" ]; then
            echo "ERROR: stb_image.h missing - stb submodule not initialized!"
            exit 1
          fi
          du -sh mlc-llm/

      - name: Install mlc_llm Python package
        run: |
          # Step 1: Clean up any compiled artifacts and stale installs
          rm -rf mlc-llm/3rdparty/tvm/build mlc-llm/build tvm_prebuilt
          find mlc-llm -name "*.dylib" -not -path "*/3rdparty/*" -delete 2>/dev/null || true
          python3 -m pip uninstall mlc_llm mlc-ai-nightly-cpu apache-tvm-ffi -y 2>/dev/null || true

          # Step 2: Build TVM from source (full compiler, CPU-only, with LLVM, no Metal)
          LLVM_CONFIG="/opt/homebrew/opt/llvm/bin/llvm-config"
          if [ ! -f "$LLVM_CONFIG" ]; then
            echo "LLVM not found at $LLVM_CONFIG. Installing via Homebrew..."
            brew install llvm
          fi
          echo "Using LLVM Config: $LLVM_CONFIG"

          mkdir -p mlc-llm/3rdparty/tvm/build
          cd mlc-llm/3rdparty/tvm/build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_LLVM="$LLVM_CONFIG" \
            -DUSE_METAL=OFF
          cmake --build . --parallel 4
          cd "$GITHUB_WORKSPACE"

          # Step 3: Copy TVM C++ libraries into TVM Python source tree
          TVM_BUILD_DIR="$GITHUB_WORKSPACE/mlc-llm/3rdparty/tvm/build"
          TVM_DYLIB=$(find "$TVM_BUILD_DIR" -name "libtvm_compiler.dylib" -o -name "libtvm.dylib" -not -path "*.dSYM*" | head -1)
          TVM_RUNTIME_DYLIB=$(find "$TVM_BUILD_DIR" -name "libtvm_runtime.dylib" -not -path "*.dSYM*" | head -1)
          TVM_FFI_DYLIB=$(find "$TVM_BUILD_DIR" -name "libtvm_ffi.dylib" -not -path "*.dSYM*" | head -1)

          if [ -z "$TVM_DYLIB" ] || [ -z "$TVM_RUNTIME_DYLIB" ] || [ -z "$TVM_FFI_DYLIB" ]; then
            echo "ERROR: Missing compiled TVM libraries in $TVM_BUILD_DIR"
            find "$TVM_BUILD_DIR" -type f
            exit 1
          fi

          # Ensure a symlink libtvm.dylib exists in the TVM build directory pointing to the compiler library
          TVM_DYLIB_DIR=$(dirname "$TVM_DYLIB")
          TVM_DYLIB_NAME=$(basename "$TVM_DYLIB")
          if [ "$TVM_DYLIB_NAME" = "libtvm_compiler.dylib" ] && [ ! -f "$TVM_DYLIB_DIR/libtvm.dylib" ]; then
            ln -sf libtvm_compiler.dylib "$TVM_DYLIB_DIR/libtvm.dylib"
          fi

          mkdir -p "$GITHUB_WORKSPACE/mlc-llm/3rdparty/tvm/python/tvm/lib"
          cp "$TVM_DYLIB" "$GITHUB_WORKSPACE/mlc-llm/3rdparty/tvm/python/tvm/lib/"
          cp "$TVM_RUNTIME_DYLIB" "$GITHUB_WORKSPACE/mlc-llm/3rdparty/tvm/python/tvm/lib/"
          
          # Rename/symlink to libtvm.dylib in the python package folder as well
          if [ "$TVM_DYLIB_NAME" = "libtvm_compiler.dylib" ]; then
            ln -sf libtvm_compiler.dylib "$GITHUB_WORKSPACE/mlc-llm/3rdparty/tvm/python/tvm/lib/libtvm.dylib"
          fi

          FFI_PY_DIR=$(find "$GITHUB_WORKSPACE/mlc-llm/3rdparty/tvm/3rdparty/tvm-ffi/python" -name "tvm_ffi" -type d | head -1)
          cp "$TVM_FFI_DYLIB" "$FFI_PY_DIR/"

          # Step 4: Install tvm_ffi from source
          cd "$GITHUB_WORKSPACE/mlc-llm/3rdparty/tvm/3rdparty/tvm-ffi"
          python3 -m pip install -e . --no-deps
          cd "$GITHUB_WORKSPACE"

          # Step 4b: Parse and install mlc_llm dependencies except TVM/FFI packages
          python3 <<'EOF'
import os, tomllib, subprocess
path = "mlc-llm/pyproject.toml"
if not os.path.exists(path):
    path = "mlc-llm/python/pyproject.toml"
with open(path, "rb") as f:
    data = tomllib.load(f)
dependencies = data.get("project", {}).get("dependencies", [])
filtered_deps = []
for dep in dependencies:
    dep_name = dep.split(";")[0].split("<")[0].split(">")[0].split("=")[0].strip().lower()
    if dep_name not in ["apache-tvm", "apache-tvm-ffi", "tvm", "tvm-ffi", "flashinfer-python"]:
        filtered_deps.append(dep)
for extra in ["fastapi", "uvicorn", "shortuuid"]:
    if extra not in [d.split("<")[0].split(">")[0].split("=")[0].strip().lower() for d in filtered_deps]:
        filtered_deps.append(extra)
print("Installing dependencies:", filtered_deps)
subprocess.run(["python3", "-m", "pip", "install"] + filtered_deps, check=True)
EOF

          # Step 5: Build MLC-LLM C++ libraries linked against our source-built TVM.
          mkdir -p mlc-llm/build
          cd mlc-llm/build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DTVM_HOME="$GITHUB_WORKSPACE/mlc-llm/3rdparty/tvm" \
            -DUSE_METAL=OFF
          cmake --build . --parallel 4
          cd "$GITHUB_WORKSPACE"

          # Step 6: Install mlc_llm Python package
          cd mlc-llm/python
          python3 -m pip install -e . --no-deps
          cd "$GITHUB_WORKSPACE"

          # Copy newly compiled libmlc_llm_module.dylib
          cp mlc-llm/build/libmlc_llm_module.dylib mlc-llm/python/mlc_llm/

          # Step 7: Expose PYTHONPATH to GITHUB_ENV
          echo "PYTHONPATH=$GITHUB_WORKSPACE/mlc-llm/3rdparty/tvm/python:$GITHUB_WORKSPACE/mlc-llm/python" >> $GITHUB_ENV

          echo "=== Verify layout ==="
          ls -lh mlc-llm/python/mlc_llm/*.dylib 2>/dev/null
          ls -lh mlc-llm/3rdparty/tvm/python/tvm/lib/*.dylib 2>/dev/null
          
          echo "=== RUNNING DIAGNOSTIC IMPORT TESTS ==="
          export PYTHONPATH="$GITHUB_WORKSPACE/mlc-llm/3rdparty/tvm/python:$GITHUB_WORKSPACE/mlc-llm/python"
          
          echo "Test 1: Import tvm..."
          python3 -c "import tvm; print('  [SUCCESS] tvm imported successfully. File:', tvm.__file__)"
          
          echo "Test 2: Import mlc_llm..."
          python3 -c "import mlc_llm; print('  [SUCCESS] mlc_llm imported successfully. File:', mlc_llm.__file__)"
          
          echo "Test 3: Import tvm then mlc_llm..."
          python3 -c "import tvm; import mlc_llm; print('  [SUCCESS] both imported successfully!')"
          
          echo "Install complete."







      - name: Setup TVM headers
        run: |
          rm -rf apps/ios_app/MLCSwift/tvm_home
          rm -rf tvm_home
          if [ -d "mlc-llm/3rdparty/tvm" ]; then
            ln -sf "$GITHUB_WORKSPACE/mlc-llm/3rdparty/tvm" apps/ios_app/MLCSwift/tvm_home
            ln -sf "$GITHUB_WORKSPACE/mlc-llm/3rdparty/tvm" tvm_home
            echo "TVM headers symlinked successfully"
          else
            echo "Warning: TVM headers not found in mlc-llm"
          fi
          if [ ! -f "apps/ios_app/MLCSwift/tvm_home/include/tvm/runtime/logging.h" ]; then
            echo "ERROR: TVM headers were not copied successfully!"
            exit 1
          fi

      - name: Build MLC-LLM iOS Libraries (${{ matrix.name }})
        run: |
          set -o pipefail
          cd apps/ios_app
          echo "Building for ${{ matrix.platform }}..."

          if [ "${{ matrix.platform }}" = "iphonesimulator" ]; then
            bash prepare_libs.sh --simulator --arch ${{ matrix.arch }}
          else
            bash prepare_libs.sh --arch ${{ matrix.arch }}
          fi

          echo "Libraries built successfully"
          if [ -d "build/lib" ]; then
            mkdir -p MLCChat/dist/lib
            cp build/lib/*.a MLCChat/dist/lib/ 2>/dev/null || true
            echo "Libraries copied to MLCChat/dist/lib"
          else
            echo "Error: build/lib directory not found!"
            exit 1
          fi

          # Create backward-compatible symlinks for Xcode project expectations
          cd MLCChat/dist/lib
          if [ -f "libmlc_llm.a" ] && [ ! -f "libmlc_llm_static.a" ]; then
            ln -sf libmlc_llm.a libmlc_llm_static.a
            echo "Created symlink: libmlc_llm_static.a -> libmlc_llm.a"
          fi
          cd "$GITHUB_WORKSPACE"

      - name: Debug Python Environment
        run: |
          echo "=== Python Debug Info ==="
          which python3
          python3 --version
          python3 -m pip list | grep -i mlc || echo "mlc not found in pip list!"

      - name: List build artifacts
        run: |
          echo "=== MLC Libraries ==="
          ls -lh apps/ios_app/MLCChat/dist/lib/ || echo "No libraries found"
          echo "=== TVM Headers ==="
          ls -lh apps/ios_app/MLCSwift/tvm_home/include/ 2>/dev/null | head -5 || echo "No headers found"

      - name: Free disk space
        run: |
          echo "Initial disk space:"
          df -h
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/*
          echo "Disk space after cleanup:"
          df -h

      - name: Package models for iOS
        run: |
          set -o pipefail
          export MLC_LLM_SOURCE_DIR="$GITHUB_WORKSPACE/mlc-llm"

          CONFIG_PATH="$GITHUB_WORKSPACE/apps/ios_app/MLCChat/mlc-package-config.json"
          if [ ! -f "$CONFIG_PATH" ]; then
            CONFIG_PATH="$GITHUB_WORKSPACE/apps/ios_app/mlc-package-config.json"
          fi
          echo "Using config: $CONFIG_PATH"
          cat "$CONFIG_PATH"

          cd "$GITHUB_WORKSPACE/apps/ios_app/MLCChat"

          echo "Python: $(which python3) ($(python3 --version))"

          export MLC_JIT_POLICY=REDO

          python3 -m mlc_llm package \
          --package-config "$CONFIG_PATH" \
          --mlc-llm-source-dir "$MLC_LLM_SOURCE_DIR" \
          --output . \
          2>&1 | tee package.log || {
          echo "=== PACKAGE FAILED ==="
          tail -n 50 package.log
          exit 1
          }

          echo "=== Last 20 lines ==="
          tail -n 20 package.log

          if [ ! -f "bundle/mlc-app-config.json" ]; then
            echo "Warning: mlc-app-config.json not generated"
          else
            echo "mlc-app-config.json generated successfully"
            head -20 bundle/mlc-app-config.json
          fi

      - name: Pre-compile Patch (memory config - MUST run before compile)
        shell: python
        run: |
          import json, os, sys
          path = 'apps/ios_app/MLCChat/bundle/Qwen2.5-1.5B-Instruct-q4f16_1-MLC/mlc-chat-config.json'
          if not os.path.exists(path):
              print(f'ERROR: config not found at {path}')
              sys.exit(1)
          with open(path, 'r') as f:
              config = json.load(f)
          # Reduce memory footprint - context 32768->2048 prevents OOM crash on iPhone
          config['context_window_size'] = 2048
          config['prefill_chunk_size'] = 128
          config['max_batch_size'] = 1
          config['model_lib'] = 'model_iphone'
          if 'model_config' in config:
              config['model_config']['context_window_size'] = 2048
              config['model_config']['prefill_chunk_size'] = 128
              config['model_config']['max_batch_size'] = 1
          with open(path, 'w') as f:
              json.dump(config, f, indent=4)
          print('\u2713 Pre-compile memory patch done: context_window=2048, prefill_chunk=128')

      - name: Compile real model library
        run: |
          DIST_LIB="$GITHUB_WORKSPACE/apps/ios_app/MLCChat/dist/lib"
          MODEL_LIB_DEST="$DIST_LIB/libmodel_iphone.a"

          echo "Compiling optimized model library for iOS..."
          MODEL_PATH="$GITHUB_WORKSPACE/apps/ios_app/MLCChat/bundle/Qwen2.5-1.5B-Instruct-q4f16_1-MLC"

          python3 -m mlc_llm compile "$MODEL_PATH" \
            --device metal \
            --host arm64-apple-ios \
            --system-lib-prefix model_iphone \
            --output "$DIST_LIB/libmodel_iphone.tar"

          echo "Extracting objects and creating static library..."
          mkdir -p /tmp/model_obj
          tar -xf "$DIST_LIB/libmodel_iphone.tar" -C /tmp/model_obj
          xcrun --sdk iphoneos libtool -static /tmp/model_obj/*.o -o "$MODEL_LIB_DEST"
          echo "✓ Real libmodel_iphone.a created successfully."
          ls -lh "$MODEL_LIB_DEST"
          rm -rf /tmp/model_obj "$DIST_LIB/libmodel_iphone.tar"

      - name: Post-compile Patch (conv_template roles - runs after compile)
        shell: python
        run: |
          import json, os, sys
          path = 'apps/ios_app/MLCChat/bundle/Qwen2.5-1.5B-Instruct-q4f16_1-MLC/mlc-chat-config.json'
          if not os.path.exists(path):
              print(f'ERROR: config not found at {path}')
              sys.exit(1)
          with open(path, 'r') as f:
              config = json.load(f)
          # Ensure memory config is still correct after compile
          config['context_window_size'] = 2048
          config['prefill_chunk_size'] = 128
          config['max_batch_size'] = 1
          config['model_lib'] = 'model_iphone'
          if 'model_config' in config:
              config['model_config']['context_window_size'] = 2048
              config['model_config']['prefill_chunk_size'] = 128
              config['model_config']['max_batch_size'] = 1
          # Patch conv_template roles
          if 'conv_template' not in config:
              config['conv_template'] = {}
          config['conv_template']['name'] = 'qwen2'
          config['conv_template']['system_template'] = '<|im_start|>system\n{system_message}<|im_end|>\n'
          config['conv_template']['system_message'] = 'You are a helpful assistant.'
          config['conv_template']['add_role_after_system_message'] = True
          config['conv_template']['roles'] = {
              "user": "<|im_start|>user",
              "assistant": "<|im_start|>assistant",
              "system": "<|im_start|>system"
          }
          config['conv_template']['role_templates'] = {
              "user": "{user_message}",
              "assistant": "{assistant_message}",
              "system": "{system_message}",
              "tool": "{tool_message}"
          }
          config['conv_template']['seps'] = ['<|im_end|>\n']
          config['conv_template']['role_content_sep'] = '\n'
          config['conv_template']['role_empty_sep'] = '\n'
          config['conv_template']['stop_str'] = ['<|endoftext|>', '<|im_end|>']
          config['conv_template']['stop_token_ids'] = [151643, 151645]
          config['conv_template']['messages'] = []
          with open(path, 'w') as f:
              json.dump(config, f, indent=4)
          print('\u2713 Post-compile roles patch done')
          print('=== FINAL CONFIG ===')
          with open(path) as f:
              print(f.read())
          print('====================')

      - name: Verify Libraries
        run: |
          set -o pipefail
          echo "=== Verifying Libraries in apps/ios_app/MLCChat/dist/lib ==="
          ls -lh apps/ios_app/MLCChat/dist/lib/

          REQUIRED_LIBS=(
            "libmlc_llm.a"
            "libtvm_runtime.a"
          )

          for lib in "${REQUIRED_LIBS[@]}"; do
            if [ ! -f "apps/ios_app/MLCChat/dist/lib/$lib" ]; then
              echo "Error: Required library $lib is missing!"
              ls -R apps/ios_app/MLCChat/dist/lib/
              exit 1
            fi
          done

          if [ ! -f "apps/ios_app/MLCChat/bundle/mlc-app-config.json" ]; then
            echo "Error: bundle/mlc-app-config.json missing - package step likely failed"
            exit 1
          fi
          echo "✓ All required libraries are present."
          echo "✓ Model bundle exists."

      - name: Build Xcode project (${{ matrix.name }})
        run: |
          set -o pipefail
          cd apps/ios_app/MLCChat
          rm -rf build_output

          # The Xcode CopyFiles build phase expects dist/bundle to exist.
          # mlc_llm package creates bundle/ (not dist/bundle/).
          if [ -d "bundle" ] && [ ! -e "dist/bundle" ]; then
            mkdir -p dist
            ln -sf "$(pwd)/bundle" dist/bundle
            echo "Created dist/bundle -> bundle symlink"
          elif [ -e "dist/bundle" ]; then
            echo "dist/bundle already exists"
          else
            echo "WARNING: bundle/ directory not found! Model will not be copied into .app"
          fi

          echo "Building for ${{ matrix.platform }}..."
          xcodebuild build \
            -project MLCChat.xcodeproj \
            -scheme MLCChat \
            -sdk ${{ matrix.sdk }} \
            -configuration Release \
            -derivedDataPath build_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee build.log || {
            echo "=== XCODE BUILD FAILED ==="
            echo "--- Last 100 lines of build.log ---"
            tail -n 100 build.log
            exit 1
          }

          rm -rf ~/.cache/mlc_llm
          echo "✓ Xcode build successful"

      - name: Create IPA package (${{ matrix.name }})
        if: matrix.platform == 'iphoneos'
        run: |
          set -o pipefail
          cd apps/ios_app/MLCChat

          APP_PATH=$(find build_output/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Valid .app bundle not found in Release-iphoneos"
            ls -R build_output/Build/Products/ || true
            exit 1
          fi

          echo "Found app bundle at: $APP_PATH"
          ls -la "$APP_PATH"

          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "ERROR: Info.plist missing in app bundle"
            find "$APP_PATH" -name "Info.plist"
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          rm -rf build_output

          zip -r -v "MLCChat-Qwen2.5-1.5B.ipa" Payload

          IPA_SIZE=$(du -h "MLCChat-Qwen2.5-1.5B.ipa" | cut -f1)
          echo "✓ IPA created: MLCChat-Qwen2.5-1.5B.ipa ($IPA_SIZE)"

          MIN_SIZE_KB=10240
          ACTUAL_SIZE_KB=$(du -k "MLCChat-Qwen2.5-1.5B.ipa" | cut -f1)
          if [ "$ACTUAL_SIZE_KB" -lt "$MIN_SIZE_KB" ]; then
            echo "ERROR: IPA size is suspiciously small (${ACTUAL_SIZE_KB}KB < ${MIN_SIZE_KB}KB). Packaging likely failed."
            exit 1
          fi

      - name: Upload to GitHub Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MLCChat-Qwen-${{ matrix.name }}
          path: |
            apps/ios_app/MLCChat/MLCChat-Qwen2.5-1.5B.ipa
            apps/ios_app/MLCChat/build.log
          retention-days: 7
          if-no-files-found: warn

      - name: Create Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && matrix.platform == 'iphoneos'
        uses: softprops/action-gh-release@v1
        with:
          files: apps/ios_app/MLCChat/MLCChat-Qwen2.5-1.5B.ipa
          tag_name: v${{ github.run_number }}
          name: MLC Chat iOS - Qwen2.5-1.5B (Build ${{ github.run_number }})
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
